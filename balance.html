<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>숫자체스 밸런스 측정</title>
<style>
  :root { --bg:#f6f5fb; --panel:#fff; --ink:#1d1a33; --muted:#6b6785; --line:#e3e0f0; --accent:#5a46e0; --ok:#1f9d63; --warn:#d9822b; --warnbg:#fff4e8; }
  @media (prefers-color-scheme: dark) { :root { --bg:#14121f; --panel:#1d1a2e; --ink:#ece9ff; --muted:#a19cc0; --line:#2e2a45; --accent:#9b8cff; --ok:#4fd39a; --warn:#ffad5c; --warnbg:#3a2a1a; } }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.5 system-ui, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; }
  main { max-width:1100px; margin:0 auto; padding:24px 16px 64px; }
  h1 { font-size:22px; margin:0 0 4px; } h2 { font-size:17px; margin:28px 0 10px; }
  .sub { color:var(--muted); margin:0 0 18px; }
  section { background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:16px; margin-top:14px; }
  button { font:inherit; padding:8px 14px; border-radius:10px; border:1px solid var(--accent); background:var(--accent); color:#fff; cursor:pointer; }
  button.ghost { background:transparent; color:var(--accent); }
  button:disabled { opacity:.5; cursor:default; }
  .row { display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
  progress { width:240px; }
  #status { color:var(--muted); }
  .tiles { display:grid; grid-template-columns:repeat(auto-fit,minmax(170px,1fr)); gap:10px; margin-bottom:14px; }
  .tile { border:1px solid var(--line); border-radius:12px; padding:10px 12px; }
  .tile.warn { background:var(--warnbg); border-color:var(--warn); }
  .tl { color:var(--muted); font-size:13px; } .tv { font-size:22px; font-weight:700; } .th { color:var(--muted); font-size:12px; }
  table { width:100%; border-collapse:collapse; font-variant-numeric:tabular-nums; }
  th, td { text-align:left; padding:6px 8px; border-bottom:1px solid var(--line); }
  th small { color:var(--muted); font-weight:400; }
  tr.out td { background:var(--warnbg); }
  .bar { position:relative; height:20px; background:var(--line); border-radius:6px; overflow:hidden; min-width:160px; }
  .bar span { position:absolute; inset:0 auto 0 0; background:var(--accent); opacity:.35; }
  .bar em { position:relative; padding-left:8px; font-style:normal; font-weight:600; line-height:20px; }
  .meta { color:var(--muted); margin:0 0 8px; }
  select { font:inherit; padding:6px 8px; border-radius:8px; border:1px solid var(--line); background:var(--panel); color:var(--ink); }
  pre { background:var(--bg); border:1px solid var(--line); border-radius:10px; padding:12px; max-height:520px; overflow:auto; font-size:13px; white-space:pre-wrap; }
  .scroll { overflow-x:auto; }
</style>
</head>
<body>
<main>
  <h1>숫자체스 · 덱 대 덱 자동 대전</h1>
  <p class="sub">결정적 전투 엔진으로 대표 덱과 무작위 덱을 수백~수천 판 붙여 밸런스를 잽니다. 목표: 덱 파워 0.85~1.15, 카드 승률 0.44~0.58, 전투 30~36박.</p>

  <section>
    <div class="row">
      <button class="measure" data-quick="1">빠른 측정 (약 10초)</button>
      <button class="measure ghost" data-quick="0">전체 측정 (약 40초)</button>
      <progress id="bar" value="0" max="1"></progress>
      <span id="status">대기 중</span>
    </div>
  </section>

  <h2>대표 덱 파워 지수 (8칸, 실효 예산 50골드)</h2>
  <section class="scroll" id="power"><p class="meta">측정 버튼을 누르세요.</p></section>

  <h2>카드별 출전 승률 (무작위 덱 필드)</h2>
  <section class="scroll" id="field"><p class="meta">측정 버튼을 누르세요.</p></section>

  <h2>전투 한 판 글자 로그</h2>
  <section>
    <div class="row">
      <label>A <select id="deckA"></select></label>
      <label>B <select id="deckB"></select></label>
      <label><input type="checkbox" id="basic"> 기본 공격도 보기</label>
      <button id="fight">전투 보기</button>
    </div>
    <pre id="log">덱을 고르고 [전투 보기]를 누르세요.</pre>
  </section>
</main>
<script type="module" src="/src/balance/main.ts"></script>
</body>
</html>
